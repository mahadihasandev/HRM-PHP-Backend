services:
  - type: web
    name: hrm-backend
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    disk:
      name: payroll-private-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_URL
        sync: false
      - key: FORCE_HTTPS
        value: true
      - key: APP_TIMEZONE
        value: Asia/Dhaka
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: DB_EMULATE_PREPARES
        value: true
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/private
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
